[package]
name = "ixa-benchmark"
version = "0.1.0"
edition = "2021"
description = "Single-replicate ixa runner for the network ABM benchmark"
publish = false

[dependencies]
ixa = "=3.1.0"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1"
humantime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "ixa-benchmark"
path = "src/main.rs"
