[project]
name = "abm-speed-benchmark"
version = "0.1.0"
description = "Reproducible network epidemic benchmark for the epiworld family and other ABM engines"
requires-python = ">=3.12,<3.14"
dependencies = [
  "covasim==3.1.8",
  "EoN==1.92",
  "epydemic==1.14.1",
  # epiworldpy main with the vendored epiworld headers that build networks
  # with a counting sort (UofUEpiBio/epiworldpy#22); no release includes it yet.
  "epiworldpy @ git+https://github.com/UofUEpiBio/epiworldpy@4a1ee0bf0db3cae181a62ec41a35f44395d0cbd0",
  "networkx==3.6.1",
  "numpy==2.2.6",
  "scipy==1.15.3",
  "starsim==3.6.1",
]

[dependency-groups]
dev = ["pytest==9.0.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
