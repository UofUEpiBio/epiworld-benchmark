[project]
name = "abm-speed-benchmark"
version = "0.1.0"
description = "Reproducible network epidemic benchmark for the epiworld family and other ABM engines"
requires-python = ">=3.12,<3.14"
dependencies = [
  "covasim==3.1.8",
  "EoN==1.92",
  "epydemic==1.14.1",
  # epiworldpy main at epiworld 0.17.1 (UofUEpiBio/epiworldpy#27); no release
  # includes it yet.
  "epiworldpy @ git+https://github.com/UofUEpiBio/epiworldpy@c24b4f9e255fdb062d8cf338c1e958dd0ec49790",
  "networkx==3.6.1",
  "numpy==2.2.6",
  "scipy==1.15.3",
  "starsim==3.6.1",
]

[dependency-groups]
dev = ["pytest==9.0.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
