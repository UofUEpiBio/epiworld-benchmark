[project]
name = "abm-speed-benchmark"
version = "0.1.0"
description = "Reproducible network epidemic benchmark for the epiworld family and other ABM engines"
requires-python = ">=3.12,<3.14"
dependencies = [
  "covasim==3.1.8",
  "EoN==1.92",
  "epydemic==1.14.1",
  # UofUEpiBio/epiworldpy#17 (native update functions for custom models) on
  # top of epiworldpy 0.17.0-0. Move to a release once it is merged.
  "epiworldpy @ git+https://github.com/UofUEpiBio/epiworldpy@583c55e23ec633c7bea8988430c1398c2489833d",
  "networkx==3.6.1",
  "numpy==2.2.6",
  "scipy==1.15.3",
]

[dependency-groups]
dev = ["pytest==9.0.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
