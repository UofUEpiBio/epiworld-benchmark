[scenario]
name = "SEIRH baseline"
description = "SEIRH epidemic with a hospitalization branch and no interventions."

[cache]
accept_published_results = true

# Every key in [disease] (and [intervention], when present) is passed to each
# runner as a --kebab-case flag, so runners must accept exactly these keys.
[disease]
target_r0 = 2.0
initial_infected = 100
latent_days = 4.0
infectious_days = 7.0
# Hospitalization is retained as a common outcome parameter. Engines whose
# native SEIR supports an H state use it directly; Covasim reports its native
# severe/hospital load. The primary timing comparison is the common SEIR core.
hospitalization_probability = 0.05
hospital_days = 7.0

[calibration]
# These empirical factors align each engine's median day-100 attack rate with
# the common benchmark target at each full-profile population size.
#
# Covasim's factors were calibrated after restricting it to fixed transmission
# and permanent immunity; its native daily transmission semantics otherwise
# produced substantially larger final attack rates under the shared analytic
# mapping.
#
# epiworldR needs no factor: its uncalibrated median attack rates (0.382 and
# 0.060) match EoN's exact continuous-time results. Starsim needs none either:
# its uncalibrated medians were 0.387 and 0.060. ABM needs none: its
# uncalibrated medians were 0.383 and 0.059.
covasim_transmission_multiplier_10000 = 0.715
covasim_transmission_multiplier_100000 = 0.710
#
# ixa shares the synchronous daily semantics of epiworldR and epydemic, but
# its uncalibrated median attack rates (0.407 and 0.067) sat above the other
# engines: it seeds the initial cases as infectious and samples each
# infectious contact independently rather than with epiworld's roulette.
ixa_transmission_multiplier_10000 = 0.983
ixa_transmission_multiplier_100000 = 0.988
#
# individual's uncalibrated median attack rates (0.441 and 0.074) sat highest:
# it seeds the initial cases as infectious, like ixa, and its infectious
# period averages the full infectious_days, where the epiworld family's
# competing hospitalization rate shortens it.
individual_transmission_multiplier_10000 = 0.951
individual_transmission_multiplier_100000 = 0.951
#
# FRED and Agents.jl were calibrated against epiworldR's medians (0.385 and
# 0.060) over 100 replicates. Agents.jl seeds the initial cases as infectious,
# like ixa, and its uncalibrated medians (0.414 and 0.065) sat slightly high.
# FRED's sat much higher (0.519 and 0.095): an agent that becomes infectious
# at hour 0 transmits the same day, where the synchronous engines' new cases
# transmit from the next step, so its outbreak grows faster.
FRED_transmission_multiplier_10000 = 0.911
FRED_transmission_multiplier_100000 = 0.898
"Agents.jl_transmission_multiplier_10000" = 0.981
"Agents.jl_transmission_multiplier_100000" = 0.982
#
# EpiModel was calibrated against epiworldR's medians (0.385 and 0.060) over
# 100 replicates; its uncalibrated medians were 0.458 and 0.086. Its modules
# run in sequence within a day: progression, then infection, so an agent that
# becomes infectious transmits the same day, where epiworld's new cases
# transmit from the next day, and its outbreak grows faster.
EpiModel_transmission_multiplier_10000 = 0.948
EpiModel_transmission_multiplier_100000 = 0.940
