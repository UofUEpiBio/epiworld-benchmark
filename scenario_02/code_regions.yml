# Anchors for the report's "Code required to define the model" table.
#
# Each region runs from the first line matching `from` to the next line
# matching `to` (both inclusive; `to` defaults to `from`). Regex anchors use R
# syntax. Paths are relative to this scenario folder, and the first file is the
# one the regions are searched in; any other files only add to the file count.
#
# This file is not part of the cache fingerprint, so editing it never
# invalidates results. Count only code that builds the population and network,
# defines the disease, and runs the simulation: argument parsing, edge-file
# reading, timing, and result writing are shared by every runner and excluded.
# Scenario 02 counts the code that records and extracts the four outputs, but
# not the code that summarizes them for the result record.
epiworldR:
  language: R
  files: [runners/epiworld.R]
  regions:
    - {from: '^vaccine_coverage <- number', to: '^vaccine_efficacy <- number'}
    - {from: '^recovery <- 1', to: '^  \(1 - hospital_probability'}
    - {from: '^model <- Model\(\)', to: '^verbose_off\(model\)'}
    - {from: '^set\.seed', to: '^add_tool\(model, vaccine\)'}
    - {from: '^run\(model'}
    - {from: '^tree <- get_transmissions', to: '^repnum <- plot'}
epiworldpy:
  language: Python
  files: [runners/run_epiworldpy.py]
  regions:
    - {from: '^def discrete_transmission_probability', to: '^    return'}
    - {from: '^def hospitalization_daily_probability', to: '^    \)$'}
    - {from: '^def run_epiworldpy', to: '^    extract_seconds = perf_counter'}
epiworld:
  language: C++
  files: [runners/epiworld/main.cpp]
  regions:
    - {from: 'double vaccine_coverage = number', to: 'double vaccine_efficacy = number'}
    - {from: '^    double recovery = 1.0', to: '^        \(1.0 - hospital_probability'}
    - {from: '^    Model<> model;', to: '^    model.verbose_off\(\);'}
    - {from: '^    model.run\(days'}
    - {from: '^    const auto & db = model.get_db', to: 'reproductive_number\[day\] = rt_sum'}
