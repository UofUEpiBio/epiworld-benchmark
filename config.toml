[study]
days = 100
replicates = 100
population_sizes = [10000, 100000]
base_seed = 8675309
engines = ["epiworldR", "covasim", "EoN", "epydemic"]

[network]
type = "watts_strogatz"
mean_degree = 10
rewire_probability = 0.05
seed = 20260907

[disease]
model = "SEIR"
target_r0 = 2.0
initial_infected = 100
latent_days = 4.0
infectious_days = 7.0
# Hospitalization is retained as a common outcome parameter. Engines whose
# native SEIR supports an H state use it directly; Covasim reports its native
# severe/hospital load. The primary timing comparison is the common SEIR core.
hospitalization_probability = 0.05
hospital_days = 7.0

[calibration]
# These empirical factors align each engine's median day-100 attack rate with
# the common benchmark target at each full-profile population size.
#
# Covasim's factors were calibrated after restricting it to fixed transmission
# and permanent immunity; its native daily transmission semantics otherwise
# produced substantially larger final attack rates under the shared analytic
# mapping.
epiworldR_transmission_multiplier_10000 = 0.887
epiworldR_transmission_multiplier_100000 = 0.855
covasim_transmission_multiplier_10000 = 0.715
covasim_transmission_multiplier_100000 = 0.710

[resources]
# Safe by default: models run sequentially and native math libraries get one
# thread. Concurrency comes from $N_THREADS (or --workers), capped by
# max_workers and by the host core count.
#
# Timings are only comparable across engines when collected at the same
# concurrency. Measured on an 11-core M3 Pro (5 performance + 6 efficiency),
# concurrency up to three workers left median simulate_seconds unchanged at
# n=100000, while six to eight workers inflated it by 1.1x to 2.2x depending
# on the engine. Because the distortion is uneven it biases the cross-engine
# comparison rather than just adding noise. See setup.md for the measurements.
workers = 1
max_workers = 8

[smoke]
days = 10
replicates = 1
population_sizes = [1000]
initial_infected = 10
